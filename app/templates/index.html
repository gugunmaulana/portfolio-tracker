<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core-Satellite Radar & Financial Freedom Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              900: '#14532d',
            },
            darkbg: '#0a0d14',
            darkcard: '#111622',
            darkborder: '#1e293b',
            lightbg: '#f8fafc',
            lightcard: '#ffffff',
            lightborder: '#e2e8f0',
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    [x-cloak] { display: none !important; }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .dark ::-webkit-scrollbar-track { background: #0b0f19; }
    .dark ::-webkit-scrollbar-thumb { background: #233044; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .badge-glow-teal {
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.45);
    }
  </style>
</head>

<body class="min-h-screen font-sans antialiased transition-colors duration-200"
      :class="theme === 'dark' ? 'bg-darkbg text-slate-100 selection:bg-cyan-500 selection:text-white' : 'bg-lightbg text-slate-800 selection:bg-cyan-600 selection:text-white'"
      x-data="portfolioApp()" x-init="initApp()">

  <!-- Sticky Top Navigation Bar -->
  <header class="sticky top-0 z-40 backdrop-blur border-b transition-colors"
          :class="theme === 'dark' ? 'bg-[#0c101a]/95 border-darkborder' : 'bg-white/95 border-lightborder shadow-sm'">
    <div class="max-w-[1920px] mx-auto px-4 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Logo, Title & Online Source Badge -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 ring-1 ring-white/20">
          <i data-lucide="radar" class="w-5 h-5 text-white animate-pulse"></i>
        </div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-base lg:text-lg font-bold tracking-tight flex items-center gap-2"
                :class="theme === 'dark' ? 'text-white' : 'text-slate-900'">
              <span x-text="t('app_title')"></span>
            </h1>
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/40 font-mono font-semibold flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
              <span x-text="t('live_feed_badge')"></span>
            </span>
          </div>
          <p class="text-xs" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" x-text="t('app_subtitle')"></p>
        </div>
      </div>

      <!-- Controls: Navigation Tabs, Realtime Speed, Lang, Theme, Actions -->
      <div class="flex items-center flex-wrap gap-2.5">
        
        <!-- Live Clock -->
        <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-mono"
             :class="theme === 'dark' ? 'bg-darkcard border-darkborder text-slate-300' : 'bg-white border-lightborder text-slate-600 shadow-sm'">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span x-text="currentTime"></span>
        </div>

        <!-- Stream Interval Selector -->
        <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-xs font-mono"
             :class="theme === 'dark' ? 'bg-darkcard border-darkborder' : 'bg-white border-lightborder shadow-sm'">
          <span class="w-2 h-2 rounded-full" :class="autoRefreshEnabled ? 'bg-emerald-400 animate-ping' : 'bg-slate-400'"></span>
          <span class="hidden sm:inline" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'">Sync:</span>
          <select x-model="refreshIntervalSeconds" @change="changeRefreshInterval()"
                  class="rounded px-1.5 py-0.5 text-[11px] font-bold outline-none cursor-pointer"
                  :class="theme === 'dark' ? 'bg-slate-900 text-emerald-400 border-slate-700' : 'bg-slate-100 text-emerald-600 border-slate-300'">
            <option value="15">⚡ 15s (Live)</option>
            <option value="30">⚡ 30s</option>
            <option value="60">⏱️ 1m</option>
            <option value="300">⏱️ 5m</option>
            <option value="0" x-text="t('pause')"></option>
          </select>
          <span class="text-[10px] text-slate-400 font-mono" x-show="autoRefreshEnabled && autoRefreshCountdown > 0" x-text="'(' + autoRefreshCountdown + 's)'"></span>
        </div>

        <!-- Language Switcher Button -->
        <button @click="toggleLanguage()" 
                class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg border text-xs font-semibold transition hover:opacity-80"
                :class="theme === 'dark' ? 'bg-darkcard border-darkborder text-cyan-300' : 'bg-white border-lightborder text-cyan-700 shadow-sm'">
          <span x-text="lang === 'id' ? '🇮🇩 ID' : '🇬🇧 EN'"></span>
        </button>

        <!-- Dark / Light Mode Switcher -->
        <button @click="toggleTheme()" 
                class="p-2 rounded-lg border text-xs transition hover:opacity-80 flex items-center justify-center"
                :class="theme === 'dark' ? 'bg-darkcard border-darkborder text-amber-400' : 'bg-white border-lightborder text-slate-700 shadow-sm'"
                :title="theme === 'dark' ? 'Switch to Light Mode' : 'Ganti ke Dark Mode'">
          <i :data-lucide="theme === 'dark' ? 'sun' : 'moon'" class="w-4 h-4"></i>
        </button>

        <!-- Add Asset Button -->
        <button @click="openAddAssetModal()" 
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold shadow-md shadow-cyan-600/20 transition active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span x-text="t('btn_add_asset')"></span>
        </button>

        <!-- Settings Modal Button -->
        <button @click="openSettingsModal()" 
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-medium transition"
                :class="theme === 'dark' ? 'bg-darkcard hover:bg-slate-800 border-darkborder text-slate-200' : 'bg-white hover:bg-slate-100 border-lightborder text-slate-700 shadow-sm'">
          <i data-lucide="target" class="w-4 h-4 text-amber-400"></i>
          <span x-text="t('btn_target_ff')"></span>
        </button>

        <!-- Manual Refresh Button -->
        <button @click="refreshData(false)" 
                :disabled="isLoading"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-medium transition disabled:opacity-50"
                :class="theme === 'dark' ? 'bg-darkcard hover:bg-slate-800 border-darkborder text-slate-200' : 'bg-white hover:bg-slate-100 border-lightborder text-slate-700 shadow-sm'">
          <i data-lucide="refresh-cw" class="w-4 h-4 text-cyan-400" :class="{ 'animate-spin': isLoading }"></i>
          <span x-text="isLoading ? t('syncing') : t('sync_now')"></span>
        </button>

      </div>

    </div>

    <!-- SUB-NAV: TAB NAVIGATION (Radar Portofolio vs Track Bulanan) -->
    <div class="max-w-[1920px] mx-auto px-4 lg:px-8 pt-2 flex items-center justify-between gap-4 border-t"
         :class="theme === 'dark' ? 'border-darkborder/50' : 'border-lightborder/60'">
      <div class="flex items-center gap-2">
        <button @click="activeTab = 'radar'" 
                class="px-4 py-2 text-xs font-bold rounded-t-lg border-b-2 flex items-center gap-2 transition"
                :class="activeTab === 'radar' 
                  ? 'border-cyan-500 text-cyan-400 bg-cyan-500/10' 
                  : (theme === 'dark' ? 'border-transparent text-slate-400 hover:text-slate-200' : 'border-transparent text-slate-500 hover:text-slate-800')">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          <span x-text="t('tab_portfolio_radar')"></span>
        </button>
        <button @click="activeTab = 'monthly'; $nextTick(() => renderMonthlyChart())" 
                class="px-4 py-2 text-xs font-bold rounded-t-lg border-b-2 flex items-center gap-2 transition"
                :class="activeTab === 'monthly' 
                  ? 'border-cyan-500 text-cyan-400 bg-cyan-500/10' 
                  : (theme === 'dark' ? 'border-transparent text-slate-400 hover:text-slate-200' : 'border-transparent text-slate-500 hover:text-slate-800')">
          <i data-lucide="calendar" class="w-4 h-4"></i>
          <span x-text="t('tab_monthly_tracker')"></span>
          <span class="px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 text-[10px] font-mono">2026</span>
        </button>
      </div>

      <!-- Quick Search in Top Bar -->
      <div x-show="activeTab === 'radar'" class="relative hidden sm:block w-64 pb-1">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-400"></i>
        <input type="text" x-model="searchQuery" :placeholder="t('search_placeholder')"
               class="w-full rounded-lg pl-8 pr-3 py-1.5 text-xs outline-none transition border font-mono"
               :class="theme === 'dark' ? 'bg-darkcard border-darkborder text-slate-200 focus:border-cyan-500' : 'bg-slate-100 border-lightborder text-slate-800 focus:border-cyan-500 focus:bg-white'">
      </div>
    </div>
  </header>

  <main class="max-w-[1920px] mx-auto px-3 sm:px-6 lg:px-8 py-5 space-y-6">

    <!-- ========================================== -->
    <!-- TAB 1: RADAR PORTOFOLIO (CORE-SATELLITE) -->
    <!-- ========================================== -->
    <div x-show="activeTab === 'radar'" class="space-y-6">

      <!-- TOP SECTION: FINANCIAL FREEDOM SCORECARDS -->
      <div class="grid grid-cols-1 xl:grid-cols-12 gap-4">
        
        <!-- CARD 1: Financial Freedom & Net Worth -->
        <div class="xl:col-span-8 border rounded-2xl p-5 lg:p-6 shadow-xl relative overflow-hidden transition-colors"
             :class="theme === 'dark' ? 'bg-darkcard border-darkborder' : 'bg-white border-lightborder shadow-slate-200/50'">
          
          <div class="relative z-10 space-y-5">
            <!-- Top Row: Target & Progress Badge -->
            <div class="flex flex-wrap items-center justify-between gap-3 border-b pb-3"
                 :class="theme === 'dark' ? 'border-darkborder/60' : 'border-lightborder'">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs font-semibold uppercase tracking-wider flex items-center gap-1.5">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                  <span x-text="t('target_ff')"></span>
                </span>
                <span class="text-sm lg:text-base font-bold font-mono"
                      :class="theme === 'dark' ? 'text-slate-200' : 'text-slate-800'"
                      x-text="formatIDR(data.target_financial_freedom_idr)"></span>
              </div>

              <div class="flex items-center gap-3">
                <span class="text-xs" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" x-text="t('milestone_progress') + ':'"></span>
                <span class="text-sm font-bold font-mono px-3 py-1 rounded-lg bg-emerald-500/15 text-emerald-400 border border-emerald-500/40"
                      x-text="(data.ff_progress_pct || 0).toFixed(2) + '%'"></span>
              </div>
            </div>

            <!-- Progress Bar -->
            <div class="space-y-1.5">
              <div class="w-full rounded-full h-3.5 p-0.5 border relative overflow-hidden"
                   :class="theme === 'dark' ? 'bg-slate-900/90 border-darkborder' : 'bg-slate-100 border-lightborder'">
                <div class="bg-gradient-to-r from-emerald-500 via-cyan-500 to-blue-500 h-full rounded-full transition-all duration-1000 relative"
                     :style="'width: ' + Math.min(Math.max(data.ff_progress_pct || 0, 1.5), 100) + '%'">
                  <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                </div>
              </div>
              <div class="flex justify-between text-[10px] font-mono" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'">
                <span>Rp 0</span>
                <span>25%</span>
                <span>50%</span>
                <span>75%</span>
                <span class="text-amber-400 font-semibold" x-text="formatIDR(data.target_financial_freedom_idr)"></span>
              </div>
            </div>

            <!-- Hero Net Worth Display -->
            <div class="pt-2 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <span class="text-xs uppercase font-medium tracking-wider" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" x-text="t('current_net_worth')"></span>
                <div class="text-3xl sm:text-4xl lg:text-5xl font-extrabold font-mono tracking-tight"
                     :class="theme === 'dark' ? 'text-white' : 'text-slate-900'"
                     x-text="formatIDR(data.current_net_worth_idr)"></div>
                <div class="text-sm font-mono flex items-center gap-1.5 mt-1" :class="theme === 'dark' ? 'text-cyan-400' : 'text-cyan-600'">
                  <i data-lucide="dollar-sign" class="w-4 h-4"></i>
                  <span><span x-text="t('equal_to')"></span>: <strong class="font-semibold" x-text="formatUSD(data.current_net_worth_usd)"></strong></span>
                </div>
              </div>

              <!-- Live FX Rates -->
              <div class="flex flex-wrap items-center gap-2 font-mono text-xs">
                <div class="px-3 py-2 rounded-xl border flex items-center gap-2"
                     :class="theme === 'dark' ? 'bg-slate-900/80 border-darkborder' : 'bg-slate-50 border-lightborder shadow-sm'">
                  <span :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'">1 USD =</span>
                  <span class="font-bold text-emerald-400" x-text="formatIDR(data.macro?.usd_idr)"></span>
                  <span class="text-[10px] px-1 rounded" :class="data.macro?.usd_idr_chg >= 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'"
                        x-text="(data.macro?.usd_idr_chg > 0 ? '+' : '') + data.macro?.usd_idr_chg + '%'"></span>
                </div>
                <div class="px-3 py-2 rounded-xl border flex items-center gap-2"
                     :class="theme === 'dark' ? 'bg-slate-900/80 border-darkborder' : 'bg-slate-50 border-lightborder shadow-sm'">
                  <span :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'">1 CNY =</span>
                  <span class="font-bold text-amber-400" x-text="formatIDR(data.macro?.cny_idr)"></span>
                  <span class="text-[10px] px-1 rounded" :class="data.macro?.cny_idr_chg >= 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'"
                        x-text="(data.macro?.cny_idr_chg > 0 ? '+' : '') + data.macro?.cny_idr_chg + '%'"></span>
                </div>
              </div>
            </div>

            <!-- Bottom Metrics Strip -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-3 border-t"
                 :class="theme === 'dark' ? 'border-darkborder/70' : 'border-lightborder'">
              <div class="p-3 rounded-xl border" :class="theme === 'dark' ? 'bg-slate-900/60 border-darkborder/70' : 'bg-slate-50 border-lightborder'">
                <span class="text-[11px] block font-medium" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" x-text="t('total_outgoings')"></span>
                <span class="text-sm sm:text-base font-bold font-mono" :class="theme === 'dark' ? 'text-slate-200' : 'text-slate-800'" x-text="formatIDR(data.total_outgoings_idr)"></span>
              </div>
              <div class="p-3 rounded-xl border" :class="theme === 'dark' ? 'bg-slate-900/60 border-darkborder/70' : 'bg-slate-50 border-lightborder'">
                <span class="text-[11px] block font-medium" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" x-text="t('total_invested')"></span>
                <span class="text-sm sm:text-base font-bold font-mono text-cyan-400" x-text="formatIDR(data.total_invested_idr)"></span>
              </div>
              <div class="p-3 rounded-xl border" :class="theme === 'dark' ? 'bg-slate-900/60 border-darkborder/70' : 'bg-slate-50 border-lightborder'">
                <span class="text-[11px] block font-medium" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" x-text="t('current_value_inv')"></span>
                <span class="text-sm sm:text-base font-bold font-mono" :class="theme === 'dark' ? 'text-slate-100' : 'text-slate-900'" x-text="formatIDR(data.current_value_investment_idr)"></span>
              </div>
              <div class="p-3 rounded-xl border" :class="theme === 'dark' ? 'bg-slate-900/60 border-darkborder/70' : 'bg-slate-50 border-lightborder'">
                <span class="text-[11px] block font-medium" :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" x-text="t('total_pnl')"></span>
                <div class="flex items-center gap-1 font-mono font-bold text-sm sm:text-base"
                     :class="data.total_pnl_idr >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                  <i :data-lucide="data.total_pnl_idr >= 0 ? 'trending-up' : 'trending-down'" class="w-4 h-4"></i>
                  <span x-text="formatIDR(data.total_pnl_idr)"></span>
                  <span class="text-xs font-normal" x-text="'(' + (data.total_pnl_pct > 0 ? '+' : '') + data.total_pnl_pct + '%)'"></span>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- CARD 2: MACRO RADAR, BENCHMARKS & QUICK LINKS -->
        <div class="xl:col-span-4 space-y-4">
          
          <!-- Benchmark Indices Table -->
          <div class="border rounded-2xl p-4 shadow-xl"
               :class="theme === 'dark' ? 'bg-darkcard border-darkborder' : 'bg-white border-lightborder shadow-sm'">
            <div class="flex items-center justify-between mb-2.5">
              <span class="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5"
                    :class="theme === 'dark' ? 'text-slate-300' : 'text-slate-700'">
                <i data-lucide="line-chart" class="w-3.5 h-3.5 text-cyan-400"></i>
                <span x-text="t('index_benchmark')"></span>
              </span>
              <span class="text-[10px] text-slate-400" x-text="t('live_returns')"></span>
            </div>

            <div class="space-y-2 font-mono text-xs">
              <!-- IHSG -->
              <div class="p-2.5 rounded-xl border" :class="theme === 'dark' ? 'bg-slate-900/80 border-darkborder' : 'bg-slate-50 border-lightborder'">
                <div class="flex items-center justify-between mb-1.5">
                  <span class="font-bold" :class="theme === 'dark' ? 'text-white' : 'text-slate-800'">IHSG (IDX COMPOSITE)</span>
                  <span class="font-bold text-cyan-400" x-text="data.macro?.benchmarks?.ihsg?.price"></span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-[10px] text-center">
                  <template x-for="p in ['24h', '1w', '1m', '6m', '1y', '5y', '10y']" :key="p">
                    <div class="p-1 rounded" :class="getPerfBg(data.macro?.benchmarks?.ihsg?.perf?.[p])">
                      <div class="text-slate-400" x-text="p"></div>
                      <div class="font-bold" x-text="formatPct(data.macro?.benchmarks?.ihsg?.perf?.[p])"></div>
                    </div>
                  </template>
                </div>
              </div>

              <!-- S&P 500 -->
              <div class="p-2.5 rounded-xl border" :class="theme === 'dark' ? 'bg-slate-900/80 border-darkborder' : 'bg-slate-50 border-lightborder'">
                <div class="flex items-center justify-between mb-1.5">
                  <span class="font-bold" :class="theme === 'dark' ? 'text-white' : 'text-slate-800'">S&P 500 (INDEXSP:.INX)</span>
                  <span class="font-bold text-emerald-400" x-text="data.macro?.benchmarks?.sp500?.price"></span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-[10px] text-center">
                  <template x-for="p in ['24h', '1w', '1m', '6m', '1y', '5y', '10y']" :key="p">
                    <div class="p-1 rounded" :class="getPerfBg(data.macro?.benchmarks?.sp500?.perf?.[p])">
                      <div class="text-slate-400" x-text="p"></div>
                      <div class="font-bold" x-text="formatPct(data.macro?.benchmarks?.sp500?.perf?.[p])"></div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>

          <!-- Quick Macro Radar Links -->
          <div class="border rounded-2xl p-4 shadow-xl"
               :class="theme === 'dark' ? 'bg-darkcard border-darkborder' : 'bg-white border-lightborder shadow-sm'">
            <div class="text-xs font-bold uppercase tracking-wider mb-2.5 flex items-center gap-1.5"
                 :class="theme === 'dark' ? 'text-slate-300' : 'text-slate-700'">
              <i data-lucide="external-link" class="w-3.5 h-3.5 text-amber-400"></i>
              <span x-text="t('macro_radar_links')"></span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 text-xs">
              <a href="https://www.multpl.com/shiller-pe" target="_blank" class="p-2 rounded-lg border transition flex items-center justify-between"
                 :class="theme === 'dark' ? 'bg-slate-900/60 hover:bg-slate-800 border-darkborder/70 text-slate-300 hover:text-cyan-300' : 'bg-slate-50 hover:bg-slate-100 border-lightborder text-slate-700 hover:text-cyan-600'">
                <span>Shiller PE Ratio</span>
                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 text-slate-400"></i>
              </a>
              <a href="https://www.blockchaincenter.net/en/bitcoin-rainbow-chart/" target="_blank" class="p-2 rounded-lg border transition flex items-center justify-between"
                 :class="theme === 'dark' ? 'bg-slate-900/60 hover:bg-slate-800 border-darkborder/70 text-slate-300 hover:text-cyan-300' : 'bg-slate-50 hover:bg-slate-100 border-lightborder text-slate-700 hover:text-cyan-600'">
                <span>BTC Rainbow Chart</span>

              <label class="flex items-center gap-2 cursor-pointer hover:opacity-80">
                <input type="checkbox" x-model="columns.status" class="rounded text-cyan-600">

              <label class="flex items-center gap-2 cursor-pointer hover:opacity-80">

                 :class="theme === 'dark' ? 'bg-slate-900/90 border-darkborder' : 'bg-slate-100/80 border-lightborder'">
              <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full"
                     :class="{
                       'bg-blue-500 shadow-lg shadow-blue-500/50': category.color === 'blue',
                       'bg-amber-500 shadow-lg shadow-amber-500/50': category.color === 'amber',
                       'bg-indigo-500 shadow-lg shadow-indigo-500/50': category.color === 'indigo',
                       'bg-emerald-500 shadow-lg shadow-emerald-500/50': category.color === 'emerald',

                     }"></div>

                      :class="theme === 'dark' ? 'text-white' : 'text-slate-900'"

                </div>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs whitespace-nowrap">

                       :class="theme === 'dark' ? 'bg-[#0b0f19] text-slate-400 border-darkborder' : 'bg-slate-50 text-slate-600 border-lightborder'">
                  <tr>
                    <th class="py-3 px-4" x-text="t('col_asset_role')"></th>

                      <!-- Role / Name -->

                        <a :href="'https://finance.yahoo.com/quote/' + item.ticker" target="_blank"
                           class="px-2 py-0.5 rounded border text-cyan-400 hover:text-cyan-300 font-bold inline-flex items-center gap-1 transition"
                           :class="theme === 'dark' ? 'bg-slate-900 border-slate-700 hover:border-cyan-500' : 'bg-slate-100 border-slate-300 hover:border-cyan-500'">
                          <span x-text="item.ticker"></span>
                          <i data-lucide="external-link" class="w-3 h-3 text-slate-400"></i>
                        </a>
                      </td>

                      <!-- Invested IDR -->
                      <td x-show="columns.invested" class="py-2.5 px-3 text-right"

                          x-text="item.invested_idr > 0 ? formatIDR(item.invested_idr) : '-'"></td>

                      <!-- Quantity -->
                      <td x-show="columns.quantity" class="py-2.5 px-3 text-right"
                          :class="theme === 'dark' ? 'text-slate-200' : 'text-slate-800'">
                        <span x-text="item.quantity > 0 ? item.quantity + (item.is_lot ? ' lot' : '') : '-'"></span>
                      </td>

                      <!-- Status Zone Badge (Z1 - Z4) -->
                      <td x-show="columns.status" class="py-2.5 px-3 text-center">
                        <span class="px-2.5 py-1 rounded text-[11px] font-bold border inline-block"
                              :class="item.status_bg" x-text="item.status_label"></span>

                      <!-- PE Ratio & Matrix Rating -->

                            <span class="font-bold" :class="theme === 'dark' ? 'text-slate-200' : 'text-slate-800'" x-text="item.pe"></span>
                            <span class="text-[10px]" :class="item.pe_color" x-text="item.pe_status"></span>
                          </div>
                        </template>
                        <template x-if="!item.pe">
                          <span class="text-slate-400">N/A</span>
                        </template>
                      </td>

                      <!-- Drawdown from ATH -->
                      <td x-show="columns.drawdown" class="py-2.5 px-3 text-right font-bold"
                          :class="item.drawdown < -25 ? 'text-rose-400' : (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')"

                      <!-- Realtime Price -->
                      <td x-show="columns.price" class="py-2.5 px-3 text-right font-bold text-emerald-400"
                          x-text="item.currency === 'IDR' ? formatIDR(item.current_price) : formatUSD(item.current_price)"></td>

                      <!-- All Time High -->
                      <td x-show="columns.ath" class="py-2.5 px-3 text-right text-slate-400"
                          x-text="item.currency === 'IDR' ? formatIDR(item.ath) : formatUSD(item.ath)"></td>

                      <!-- Average Price -->
                      <td x-show="columns.avg_price" class="py-2.5 px-3 text-right"
                          :class="theme === 'dark' ? 'text-slate-300' : 'text-slate-700'"
                          x-text="item.avg_price > 0 ? (item.currency === 'IDR' ? formatIDR(item.avg_price) : formatUSD(item.avg_price)) : '-'"></td>

                      <!-- Current Value (IDR / USD) -->
                      <td x-show="columns.current_value" class="py-2.5 px-3 text-right">
                        <template x-if="item.cur_val_idr > 0">
                          <div>
                            <div class="font-bold text-cyan-400" x-text="formatIDR(item.cur_val_idr)"></div>
                            <div class="text-[10px] text-slate-400" x-text="formatUSD(item.cur_val_usd)"></div>
                          </div>
                        </template>
                        <template x-if="!item.cur_val_idr || item.cur_val_idr === 0">
                          <span class="text-slate-400">-</span>
                        </template>
                      </td>

                      <!-- Gain / Loss PnL -->
                      <td x-show="columns.pnl" class="py-2.5 px-3 text-right">
                        <template x-if="item.invested_idr > 0">
                          <div>
                            <div class="font-bold" :class="item.pnl_idr >= 0 ? 'text-emerald-400' : 'text-rose-400'"

                            <div class="text-[10px] font-semibold" :class="item.pnl_pct >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                                 x-text="(item.pnl_pct >= 0 ? '+' : '') + item.pnl_pct + '%'"></div>
                          </div>
                        </template>
                        <template x-if="!item.invested_idr || item.invested_idr === 0">
                          <span class="text-slate-400">-</span>
                        </template>
                      </td>

                      <!-- Performance Strip (24h, 1w, 1m, 6m, 1y, 5y, 10y, 15y, 20y) -->
                      <td x-show="columns.perf" class="py-2.5 px-4">
                        <div class="grid grid-cols-9 gap-1 text-[10px] text-center w-80">
                          <template x-for="timeframe in ['24h', '1w', '1m', '6m', '1y', '5y', '10y', '15y', '20y']" :key="timeframe">
                            <div class="p-0.5 rounded" :class="getPerfBg(item.perf?.[timeframe])">
                              <span x-text="formatPct(item.perf?.[timeframe])"></span>
                            </div>
                          </template>
                        </div>
                      </td>

                      <!-- Actions -->
                      <td class="py-2.5 px-3 text-center">
                        <div class="flex items-center justify-center gap-1">
                          <button @click="editAsset(item)" class="p-1 rounded transition text-slate-400 hover:text-cyan-400 hover:bg-slate-700/50" :title="t('edit_asset')">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                          </button>
                          <button @click="deleteAsset(item.id)" class="p-1 rounded transition text-slate-400 hover:text-rose-400 hover:bg-rose-950/30" :title="t('delete_asset')">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </td>

                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

          </div>
        </template>

        <div>
          <h2 class="text-base font-bold flex items-center gap-2" :class="theme === 'dark' ? 'text-white' : 'text-slate-900'">

    const MONTH_TRANSLATIONS = {
      January: { id: "Januari", en: "January" },
      February: { id: "Februari", en: "February" },
      March: { id: "Maret", en: "March" },
      April: { id: "April", en: "April" },
      May: { id: "Mei", en: "May" },
      June: { id: "Juni", en: "June" },
      July: { id: "Juli", en: "July" },
      August: { id: "Agustus", en: "August" },
      September: { id: "September", en: "September" },
      October: { id: "Oktober", en: "October" },
      November: { id: "November", en: "November" },
      December: { id: "Desember", en: "December" }
    };

    function portfolioApp() {
      return {
        data: {{ portfolio | tojson | safe }},
        monthlyRecords: {{ monthly | tojson | safe }},
        activeTab: 'radar',
        theme: localStorage.getItem('portfolio_theme') || 'dark',
        lang: localStorage.getItem('portfolio_lang') || 'id',
        isLoading: false,
        currentTime: '',
        autoRefreshEnabled: true,
        refreshIntervalSeconds: 15,
        autoRefreshCountdown: 15,
        countdownTimer: null,
        searchQuery: '',
        selectedCategory: 'all',
        selectedZone: 'all',
        selectedPE: 'all',
        growthChartInstance: null,

        // Column Visibility Preferences
        columns: {
          invested: true,
          quantity: true,
          status: true,
          pe: true,
          drawdown: true,
          price: true,
          ath: true,
          avg_price: true,
          current_value: true,
          pnl: true,
          perf: true
        },

        // Modals & Forms
        showAssetModal: false,
        showSettingsModal: false,
        showMonthlyModal: false,
        toast: { show: false, message: '' },

        assetForm: {
          id: null,
          category: 'core_radar',
          ticker: '',
          name: '',
          currency: 'USD',
          invested_idr: 0,
          quantity: 0,
          avg_price: 0,
          is_lot: false,
          pe_great: null,
          pe_good: null,
          pe_exp: null
        },

        monthlyForm: {
          id: null,
          year: 2026,
          month_index: 1,
          month_name: 'January',
          total_outgoings: 0,
          current_networth: 0,
          investing_power: 0,
          growth_pct: 0,
          notes: ''
        },

        settingsForm: {
          target_financial_freedom: 8844000000,
          total_outgoings: 91457683,
          cash_balance: 7525939
        },

        t(key) {
          return I18N[this.lang]?.[key] || I18N['id']?.[key] || key;
        },

        tMonth(m) {
          return MONTH_TRANSLATIONS[m]?.[this.lang] || m;
        },

        initApp() {
          this.applyTheme();
          this.updateClock();
          setInterval(() => this.updateClock(), 1000);
          this.startAutoRefreshTimer();
          lucide.createIcons();
          this.settingsForm = {
            target_financial_freedom: this.data.target_financial_freedom_idr,
            total_outgoings: this.data.total_outgoings_idr,
            cash_balance: this.data.cash_balance_idr
          };
          this.$nextTick(() => {
            this.renderMonthlyChart();
          });
        },

        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('portfolio_theme', this.theme);
          this.applyTheme();
          this.$nextTick(() => {
            lucide.createIcons();
            this.renderMonthlyChart();
          });
        },

        applyTheme() {
          if (this.theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        },

        toggleLanguage() {
          this.lang = this.lang === 'id' ? 'en' : 'id';
          localStorage.setItem('portfolio_lang', this.lang);
          this.$nextTick(() => {
            lucide.createIcons();
            this.renderMonthlyChart();
          });
        },

        startAutoRefreshTimer() {
          if (this.countdownTimer) clearInterval(this.countdownTimer);
          this.countdownTimer = setInterval(() => {
            const sec = parseInt(this.refreshIntervalSeconds);
            if (sec <= 0) {
              this.autoRefreshEnabled = false;
              return;
            }
            this.autoRefreshEnabled = true;
            if (this.autoRefreshCountdown > 1) {
              this.autoRefreshCountdown--;
            } else {
              this.autoRefreshCountdown = sec;
              this.refreshData(true);
            }
          }, 1000);
        },

        changeRefreshInterval() {
          const sec = parseInt(this.refreshIntervalSeconds);
          if (sec <= 0) {
            this.autoRefreshEnabled = false;
            this.showToast(this.lang === 'id' ? 'Live stream dijeda' : 'Live stream paused');
          } else {
            this.autoRefreshEnabled = true;
            this.autoRefreshCountdown = sec;
            this.showToast(this.lang === 'id' ? `Mode streaming diset ke tiap ${sec} detik` : `Streaming mode set to every ${sec}s`);
          }
        },

        updateClock() {
          const now = new Date();
          const loc = this.lang === 'id' ? 'id-ID' : 'en-US';
          this.currentTime = now.toLocaleDateString(loc, { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + now.toLocaleTimeString(loc);
        },

        showToast(msg) {
          this.toast.message = msg;
          this.toast.show = true;
          setTimeout(() => this.toast.show = false, 4000);
        },

        get filteredCategories() {
          if (this.selectedCategory === 'all') {
            return this.data.categories || [];
          }
          return (this.data.categories || []).filter(c => c.id === this.selectedCategory);
        },

        filterItems(items) {
          return (items || []).filter(item => {
            // Search Query Filter
            if (this.searchQuery.trim()) {
              const q = this.searchQuery.toLowerCase();
              const matchTicker = item.ticker?.toLowerCase().includes(q);
              const matchName = item.name?.toLowerCase().includes(q);
              if (!matchTicker && !matchName) return false;
            }
            // Zone Filter
            if (this.selectedZone !== 'all') {
              if (item.status_code !== this.selectedZone) return false;
            }
            // PE Filter
            if (this.selectedPE !== 'all') {
              if (item.pe_status !== this.selectedPE) return false;
            }
            return true;
          });
        },

        calculateTotalInvestingPower() {
          return (this.monthlyRecords || []).reduce((acc, curr) => acc + (curr.investing_power || 0), 0);
        },

        getGrowthHeatmapClass(row) {
          if (!row.current_networth || row.current_networth === 0) {
            return this.theme === 'dark' ? 'bg-slate-900/40 border-slate-800 text-slate-500' : 'bg-slate-50 border-slate-200 text-slate-400';
          }
          if (row.growth_pct > 0) {
            return 'bg-emerald-950/60 border-emerald-700/60 text-emerald-400';
          } else if (row.growth_pct < 0) {
            return 'bg-rose-950/70 border-rose-700/60 text-rose-300';
          } else {
            return this.theme === 'dark' ? 'bg-slate-800/80 border-slate-600 text-white' : 'bg-slate-200 border-slate-300 text-slate-800';
          }
        },

        renderMonthlyChart() {
          const canvas = document.getElementById('monthlyGrowthChart');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (this.growthChartInstance) {
            this.growthChartInstance.destroy();
          }

          const filtered = (this.monthlyRecords || []).filter(r => r.current_networth > 0);
          const labels = filtered.map(r => this.tMonth(r.month_name).substring(0, 3));
          const networthData = filtered.map(r => r.current_networth / 1000000); // in Millions IDR

          const isDark = this.theme === 'dark';
          const gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.06)';
          const textColor = isDark ? '#94a3b8' : '#64748b';

          this.growthChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: this.lang === 'id' ? 'Net Worth (Juta Rp)' : 'Net Worth (Million IDR)',
                data: networthData,
                borderColor: '#06b6d4',
                backgroundColor: 'rgba(6, 182, 212, 0.15)',
                borderWidth: 2.5,
                fill: true,
                tension: 0.35,
                pointBackgroundColor: '#10b981',
                pointBorderColor: '#fff',
                pointRadius: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (ctx) => `Rp ${ctx.parsed.y.toFixed(1)} Juta`
                  }
                }
              },
              scales: {
                x: {
                  grid: { color: gridColor },
                  ticks: { color: textColor, font: { size: 10 } }
                },
                y: {
                  grid: { color: gridColor },
                  ticks: {
                    color: textColor,
                    font: { size: 10 },
                    callback: (val) => `${val}M`
                  }
                }
              }
            }
          });
        },

        async refreshData(isSilent = false) {
          if (!isSilent) this.isLoading = true;
          try {
            const res = await fetch('/api/refresh', { method: 'POST' });
            const json = await res.json();
            if (json.data) {
              this.data = json.data;
              this.autoRefreshCountdown = parseInt(this.refreshIntervalSeconds) || 15;
              if (!isSilent) {
                this.showToast(this.lang === 'id' ? 'Data pasar realtime berhasil disinkronkan!' : 'Market data synchronized in realtime!');
              }
              this.$nextTick(() => lucide.createIcons());
            }
          } catch (e) {
            console.error(e);
          } finally {
            if (!isSilent) this.isLoading = false;
          }
        },

        openAddAssetModal() {
          this.assetForm = {
            id: null,
            category: 'core_radar',
            ticker: '',
            name: '',
            currency: 'USD',
            invested_idr: 0,
            quantity: 0,
            avg_price: 0,
            is_lot: false,
            pe_great: null,
            pe_good: null,
            pe_exp: null
          };
          this.showAssetModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        editAsset(item) {
          this.assetForm = { ...item };
          this.showAssetModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async saveAsset() {
          const isNew = !this.assetForm.id;
          try {
            const res = await fetch('/api/assets/upsert', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.assetForm)
            });
            const json = await res.json();
            if (json.data) {
              this.data = json.data;
              this.showAssetModal = false;
              // Clear prominent toast for adding asset
              this.showToast(isNew ? this.t('asset_added_success') : this.t('asset_updated_success'));
              this.$nextTick(() => lucide.createIcons());
            }
          } catch (e) {
            console.error(e);
          }
        },

        async deleteAsset(id) {
          if (!id) return;
          const confirmMsg = this.lang === 'id' ? 'Apakah Anda yakin ingin menghapus aset ini dari radar?' : 'Are you sure you want to remove this asset from radar?';
          if (!confirm(confirmMsg)) return;
          try {
            const res = await fetch(`/api/assets/${id}`, { method: 'DELETE' });
            const json = await res.json();
            if (json.data) {
              this.data = json.data;
              this.showToast(this.t('asset_deleted_success'));
              this.$nextTick(() => lucide.createIcons());
            }
          } catch (e) {
            console.error(e);
          }
        },

        openAddMonthlyModal() {
          this.monthlyForm = {
            id: null,
            year: 2026,
            month_index: 9,
            month_name: 'September',
            total_outgoings: 91457683,
            current_networth: 85256693,
            investing_power: 0,
            growth_pct: 0,
            notes: ''
          };
          this.showMonthlyModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        editMonthlyRecord(row) {
          this.monthlyForm = { ...row };
          this.showMonthlyModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async saveMonthlyRecord() {
          try {
            const res = await fetch('/api/monthly/upsert', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.monthlyForm)
            });
            const json = await res.json();
            if (json.data) {
              this.monthlyRecords = json.data;
              this.showMonthlyModal = false;
              this.showToast(this.t('monthly_updated_success'));
              this.$nextTick(() => {
                lucide.createIcons();
                this.renderMonthlyChart();
              });
            }
          } catch (e) {
            console.error(e);
          }
        },

        openSettingsModal() {
          this.settingsForm = {
            target_financial_freedom: this.data.target_financial_freedom_idr,
            total_outgoings: this.data.total_outgoings_idr,
            cash_balance: this.data.cash_balance_idr
          };
          this.showSettingsModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async saveSettings() {
          try {
            const res = await fetch('/api/settings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.settingsForm)
            });
            const json = await res.json();
            if (json.data) {
              this.data = json.data;
              this.showSettingsModal = false;
              this.showToast(this.t('settings_updated_success'));
              this.$nextTick(() => lucide.createIcons());
            }
          } catch (e) {
            console.error(e);
          }
        },

        // Formatters
        formatIDR(val) {
          if (val === undefined || val === null || isNaN(val)) return 'Rp 0';
          return 'Rp ' + Math.round(val).toLocaleString('id-ID');
        },

        formatUSD(val) {
          if (val === undefined || val === null || isNaN(val)) return '$0.00';
          return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        formatPct(val) {
          if (val === undefined || val === null || isNaN(val)) return 'N/A';
          return (val > 0 ? '+' : '') + Number(val).toFixed(1) + '%';
        },

        getPerfBg(val) {
          if (val === undefined || val === null || isNaN(val)) return 'bg-slate-900/40 text-slate-500 border border-slate-800';
          if (val > 0) return 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/40';
          if (val < 0) return 'bg-rose-950/60 text-rose-400 border border-rose-800/40';
          return 'bg-slate-900/40 text-slate-400';
        }
      }
